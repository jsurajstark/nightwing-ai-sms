[project]
name = "nightwing-ai-sms-demo"
version = "0.1.0"
description = "Demo FastAPI app: SMS intake simulation with Ollama or Gemini extraction."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "google-genai>=1.0",
    "celery[redis]>=5.4.0",
]

[project.optional-dependencies]
sqs = ["boto3>=1.35.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
